services:
  postgres:
    image: postgres:18
    container_name: easyclip-postgres
    ports:
      - '127.0.0.1:5432:5432'
    env_file:
      - ../.env.local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: app_db
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
