services:
  postgres:
    image: postgres:18
    container_name: easyclip-postgres
    ports:
      - '127.0.0.1:5432:5432'
    env_file:
      - ../.env.local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: app_db
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: easy-clip-api:local
    container_name: easyclip-api
    env_file:
      - ../.env.local
    environment:
      NODE_ENV: local
      PORT: 3000
    command:
      - sh
      - -c
      - 'DATABASE_URL="postgresql://postgres:$${POSTGRES_PASSWORD}@postgres:5432/app_db?schema=public" node dist/src/main.js'
    ports:
      - '127.0.0.1:${LOCAL_API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    container_name: easyclip-postgres-exporter
    environment:
      DATA_SOURCE_URI: 'postgres:5432/app_db?sslmode=disable'
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: easyclip-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - postgres-exporter

  loki:
    image: grafana/loki:3.7.0
    container_name: easyclip-loki
    command:
      - '-config.file=/etc/loki/config.yml'
    volumes:
      - ./loki/loki.local.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ['CMD', '/usr/bin/loki', '-health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: easyclip-alloy
    command:
      - run
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
      - /etc/alloy/config.alloy
    ports:
      - '127.0.0.1:12345:12345'
    volumes:
      - ./alloy/config.local.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      api:
        condition: service_started
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.1.0
    container_name: easyclip-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '127.0.0.1:3300:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
